{% load static %}

<header class="">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><h2>Stand Blog<em>.</em></h2></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                    aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                        <a class="nav-link" href="/">Home
                            <span class="sr-only">(current)</span>
                        </a>
                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'articles' %}active{% endif %}">
                        <a class="nav-link" href="{% url 'blog:articles' %}">Articles</a>
                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'contact_us' %}active{% endif %}">
                        <a class="nav-link" href="{% url 'blog:contact_us' %}">Contact Us</a>
                    </li>


                    {% if request.user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'account:logout' %}">logout</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="">{{ request.user.username }}</a>
                        </li>
                        <li>
                            {% if request.user.profile.image %}
                                <img src="{{ request.user.profile.image.url }}" alt="profile image" width="40"
                                     height="40" style="border-radius: 50%">
                            {% else %}
                                <img src="{% static 'images/default.png' %}" alt="profile image" width="40" height="40"
                                     style="border-radius: 50%">
                            {% endif %}
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'account:register' %}">register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'account:login' %}">login</a>
                        </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>
</header>
